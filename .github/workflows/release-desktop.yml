name: Release Desktop (10Router)

# Fork-specific release pipeline: builds the desktop app for macOS (Apple
# Silicon and Intel) and Windows (x64), then publishes the artifacts to a
# GitHub Release.
#
# Assets are named to match what the in-app fallback updater expects
# (ui/desktop/src/utils/githubUpdater.ts): 10Router.zip, 10Router_intel_mac.zip,
# 10Router-win32-x64.zip and mac-update-requirements.json must keep their exact
# names.
#
# Trigger: push a tag "vX.Y.Z", or run manually (version defaults to
# ui/desktop/package.json).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without leading v (e.g. 1.58.1). Defaults to ui/desktop/package.json'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build-macos:
    name: Build macOS (Apple Silicon)
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(jq -r .version ui/desktop/package.json)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/set-cargo-version.sh "$VERSION"
          cd ui/desktop
          npm pkg set "version=${VERSION}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: macos-release-arm64

      - name: Build goose backend
        run: |
          source ./bin/activate-hermit
          brew install openssl@3
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          rustup target add aarch64-apple-darwin
          cargo build --release -p goose-cli --bin goose --target aarch64-apple-darwin

      - name: Stage backend binary
        run: |
          mkdir -p ui/desktop/src/bin
          cp target/aarch64-apple-darwin/release/goose ui/desktop/src/bin/goose
          chmod +x ui/desktop/src/bin/goose

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ui/desktop/node_modules
            .hermit/node/cache
          key: macos-pnpm-cache-v1-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            macos-pnpm-cache-v1-${{ runner.os }}-

      - name: Install dependencies
        run: source ../../bin/activate-hermit && pnpm install --frozen-lockfile
        working-directory: ui/desktop

      - name: Build app (DMG + zip)
        run: |
          source ../../bin/activate-hermit
          attempt=0
          max_attempts=2
          until [ $attempt -ge $max_attempts ]; do
            pnpm run bundle:default && break
            attempt=$((attempt + 1))
            echo "Attempt $attempt failed. Retrying..."
            sleep 5
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "Action failed after $max_attempts attempts."
            exit 1
          fi
        working-directory: ui/desktop

      - name: Verify and record macOS update resources
        run: |
          node scripts/verify-mac-update-resources.js out/10Router-darwin-arm64/10Router.app
          node scripts/mac-update-requirements.js \
            out/10Router-darwin-arm64/10Router.app \
            out/10Router-darwin-arm64/10Router.zip.macos.json
        working-directory: ui/desktop

      - name: Quick launch test
        run: |
          xattr -cr ui/desktop/out/10Router-darwin-arm64/10Router.app
          open -g ui/desktop/out/10Router-darwin-arm64/10Router.app
          sleep 5
          if pgrep -f "10Router.app/Contents/MacOS/10Router" > /dev/null; then
            echo "App appears to be running."
          else
            echo "App did not stay open. Possible crash or startup error."
            exit 1
          fi
          pkill -f "10Router.app/Contents/MacOS/10Router"

      - name: Stage release files
        run: |
          mkdir -p ui/desktop/dist
          cp ui/desktop/out/make/*.dmg ui/desktop/dist/
          cp ui/desktop/out/10Router-darwin-arm64/10Router.zip ui/desktop/dist/
          cp ui/desktop/out/10Router-darwin-arm64/10Router.zip.macos.json ui/desktop/dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-macos-arm64
          path: ui/desktop/dist
          if-no-files-found: error
          retention-days: 5

  build-macos-intel:
    name: Build macOS (Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve version
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(jq -r .version ui/desktop/package.json)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/set-cargo-version.sh "$VERSION"
          cd ui/desktop
          npm pkg set "version=${VERSION}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: macos-release-x64

      - name: Build goose backend
        run: |
          source ./bin/activate-hermit
          brew install openssl@3
          export OPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
          rustup target add x86_64-apple-darwin
          cargo build --release -p goose-cli --bin goose --target x86_64-apple-darwin

      - name: Stage backend binary
        run: |
          mkdir -p ui/desktop/src/bin
          cp target/x86_64-apple-darwin/release/goose ui/desktop/src/bin/goose
          chmod +x ui/desktop/src/bin/goose

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ui/desktop/node_modules
            .hermit/node/cache
          key: macos-pnpm-cache-v1-${{ runner.os }}-${{ hashFiles('ui/pnpm-lock.yaml') }}
          restore-keys: |
            macos-pnpm-cache-v1-${{ runner.os }}-

      - name: Install dependencies
        run: source ../../bin/activate-hermit && pnpm install --frozen-lockfile
        working-directory: ui/desktop

      - name: Build app (DMG + zip)
        env:
          ELECTRON_ARCH: x64
        run: |
          source ../../bin/activate-hermit
          attempt=0
          max_attempts=2
          until [ $attempt -ge $max_attempts ]; do
            pnpm run bundle:intel && break
            attempt=$((attempt + 1))
            echo "Attempt $attempt failed. Retrying..."
            sleep 5
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "Action failed after $max_attempts attempts."
            exit 1
          fi
        working-directory: ui/desktop

      - name: Stage release files
        run: |
          mkdir -p ui/desktop/dist
          cp ui/desktop/out/make/*.dmg ui/desktop/dist/
          cp ui/desktop/out/10Router-darwin-x64/10Router_intel_mac.zip ui/desktop/dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-macos-x64
          path: ui/desktop/dist
          if-no-files-found: error
          retention-days: 5

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.10.0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(jq -r .version ui/desktop/package.json)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update versions
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/set-cargo-version.sh "$VERSION"
          cd ui/desktop
          npm pkg set "version=${VERSION}"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          key: windows-release-x64

      - name: Build goose backend
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-msvc
          cargo build --release --target x86_64-pc-windows-msvc -p goose-cli --bin goose

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Cache node_modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            node_modules
            ui/desktop/node_modules
            .hermit/node/cache
          key: windows-pnpm-cache-v1-${{ runner.os }}-node24-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            windows-pnpm-cache-v1-${{ runner.os }}-node24-

      - name: Prepare Windows binary
        shell: bash
        run: |
          rm -rf ./ui/desktop/src/bin
          mkdir -p ./ui/desktop/src/bin
          cp -f ./target/x86_64-pc-windows-msvc/release/goose.exe ./ui/desktop/src/bin/

          if [ -d "./ui/desktop/src/platform/windows/bin" ]; then
            for file in ./ui/desktop/src/platform/windows/bin/*.{exe,dll,cmd}; do
              filename="$(basename "$file")"
              if [ -f "$file" ] && [ "$filename" != "goose.exe" ]; then
                cp -f "$file" ./ui/desktop/src/bin/
              fi
            done

            if [ -d "./ui/desktop/src/platform/windows/bin/goose-npm" ]; then
              cp -r ./ui/desktop/src/platform/windows/bin/goose-npm/ ./ui/desktop/src/bin/goose-npm/
            fi
          fi

      - name: Force GitHub HTTPS for npm git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"

      - name: Build desktop app
        shell: bash
        env:
          ELECTRON_PLATFORM: win32
        run: |
          cd ui/desktop
          pnpm install --frozen-lockfile
          node scripts/build-main.js
          node scripts/prepare-platform-binaries.js
          pnpm run make --platform=win32 --arch=x64

      - name: Prepare flat distribution
        shell: bash
        run: |
          cd ui/desktop
          mkdir -p ./out/10Router-win32-x64/resources/bin
          cp -r src/bin/* out/10Router-win32-x64/resources/bin/

          mkdir -p ./dist-windows
          cp -r ./out/10Router-win32-x64/* ./dist-windows/
          ls -la ./dist-windows/
          ls -la ./dist-windows/resources/bin/

      - name: Create zip package
        shell: bash
        run: |
          cd ui/desktop
          7z a -tzip 10Router-win32-x64.zip dist-windows/

      - name: Build NSIS installer
        shell: bash
        run: pnpm run make:win32-installer ./dist-windows
        working-directory: ui/desktop

      - name: Stage release files
        shell: bash
        run: |
          mkdir -p ui/desktop/dist
          cp ui/desktop/10Router-win32-x64.zip ui/desktop/dist/
          cp ui/desktop/out/make/nsis/win32/x64/10Router-win32-x64-setup.exe ui/desktop/dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: desktop-windows-x64
          path: ui/desktop/dist
          if-no-files-found: error
          retention-days: 5

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-macos-intel, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: desktop-macos-arm64
          path: mac

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: desktop-macos-x64
          path: mac

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: desktop-windows-x64
          path: win

      - name: Compose mac-update-requirements.json
        env:
          VERSION: ${{ needs.build-macos.outputs.version }}
        run: |
          jq --arg version "$VERSION" '. + {version: $version}' \
            mac/10Router.zip.macos.json > mac/mac-update-requirements.json
          cat mac/mac-update-requirements.json

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build-macos.outputs.tag }}
          VERSION: ${{ needs.build-macos.outputs.version }}
        run: |
          assets=(
            mac/10Router-*.dmg
            mac/10Router.zip
            mac/10Router_intel_mac.zip
            mac/mac-update-requirements.json
            win/10Router-win32-x64.zip
            win/10Router-win32-x64-setup.exe
          )
          if gh release view "$TAG" > /dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
              echo "Deleting stale draft release $TAG and recreating it published."
              gh release delete "$TAG" --yes
            else
              echo "Release $TAG already exists, uploading assets."
              if ! gh release upload "$TAG" "${assets[@]}" --clobber 2> gh-err.txt; then
                echo "::error::gh release upload failed: $(tr '\n' ' ' < gh-err.txt | tail -c 400)"
                exit 1
              fi
              exit 0
            fi
          fi
          target_args=()
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "Tag $TAG exists, release will use it."
          else
            target_args=(--target "$GITHUB_SHA")
          fi
          if ! gh release create "$TAG" "${assets[@]}" \
              --title "10Router $VERSION" \
              --generate-notes \
              "${target_args[@]}" 2> gh-err.txt; then
            echo "::error::gh release create failed: $(tr '\n' ' ' < gh-err.txt | tail -c 400)"
            exit 1
          fi
