name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.filter.outputs.docs-only }}
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # pin@v3
        id: filter
        with:
          filters: |
            docs-only:
              - 'documentation/**'
            code:
              - '!documentation/**'

  rust-build-and-test:
    name: Build and Test Rust Project
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-on-failure: true

      - name: Install Dependencies
        run: |
          sudo apt update -y
          sudo apt install -y libdbus-1-dev libxcb1-dev
          if [ -z "$(swapon --show)" ]; then
            sudo fallocate -l 8G /mnt/swapfile
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          fi
          free -m

      - name: Build and Test
        run: |
          set +e
          export CARGO_INCREMENTAL=0
          {
            echo "=== df/free before ==="
            df -h / /home 2>/dev/null; free -m 2>/dev/null || true
            cargo test --locked
            rc=$?
            echo "CARGO_EXIT=$rc"
            echo "=== df/free after ==="
            df -h / /home 2>/dev/null; free -m 2>/dev/null || true
            exit $rc
          } > "$RUNNER_TEMP/cargo-test.log" 2>&1
        working-directory: crates
        env:
          RUST_MIN_STACK: 8388608
          GOOSE_DISABLE_KEYRING: 1
          CARGO_PROFILE_DEV_DEBUG: 0
          CARGO_PROFILE_TEST_DEBUG: 0
          CMAKE_BUILD_PARALLEL_LEVEL: 2

      - name: Report failing test names
        if: failure()
        run: |
          LOG="$RUNNER_TEMP/cargo-test.log"
          if [ ! -f "$LOG" ]; then
            echo "::error::cargo-test.log missing at $RUNNER_TEMP"
            exit 0
          fi
          failing() {
            awk '/^failures:$/{f=1;next} f&&/^$/{f=0} f&&/^    /{print $1}' "$LOG" | sort -u
          }
          failing | head -10 | while read -r test; do
            echo "::error::failing test: $test"
          done
          grep -E "process didn't exit successfully|signal: [0-9]+|error: could not compile|error\[|^error" "$LOG" \
            | sort -u | head -10 | while read -r line; do
            echo "::error::$line"
          done
          echo "::error::log stats: $(wc -l < "$LOG") lines; TAIL: $(tail -n 30 "$LOG" | tr '\n' '|' | cut -c1-700)"

  desktop-lint:
    name: Test and Lint Electron Desktop App
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Dependencies
        run: source ../../bin/activate-hermit && pnpm install --frozen-lockfile
        working-directory: ui/desktop

      - name: Run Lint
        run: source ../../bin/activate-hermit && pnpm run lint:check
        working-directory: ui/desktop

      - name: Run Tests
        run: source ../../bin/activate-hermit && pnpm run test:run
        working-directory: ui/desktop

      - name: Test macOS update manifests
        run: source ../../bin/activate-hermit && node --test scripts/mac-update-requirements.test.cjs
        working-directory: ui/desktop

  desktop-updater-install:
    name: Test Desktop Updater Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true' || github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24.10.0

      - name: Install pnpm
        run: npm install -g pnpm@10.30.3

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ui/desktop

      - name: Run Updater Install Test
        run: pnpm exec vitest run src/utils/githubUpdater.install.test.ts
        working-directory: ui/desktop
